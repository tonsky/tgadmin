name: build

on:
  push:
    branches:
      - 'main'
    paths:
      - '**.go'
      - go.mod
      - internal/tgadmin/jev_prompt.txt
      - .github/workflows/build.yml
      - script/package.sh
      - script/test.sh

jobs:  
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Test
        run: ./script/test.sh

      - name: Package
        run: ./script/package.sh
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
